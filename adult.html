              <div class="ishan-poster-wrap">
                <img src="${poster}" alt="${escapeHtml(title)}" class="ishan-poster" loading="lazy" />
                <span class="ishan-badge-adult">18+</span>
                <span class="ishan-badge-rating">★ ${rating}</span>
                <div class="ishan-card-overlay">
                  <div class="ishan-play-circle">▶</div>
                </div>
              </div>
              <div class="ishan-card-info">
                <div class="ishan-card-title">${escapeHtml(title)}</div>
                <div class="ishan-card-meta">
                  <span>${year || 'Movie'}</span>
                  <span>•</span>
                  <span>18+ Adult</span>
                </div>
              </div>
            `;

            card.onclick = () => openPlayer(m);
            grid.appendChild(card);
          }
        }

        function openPlayer(movie) {
          currentMovie = movie;
          const modal = document.getElementById('ishan-player-modal');
          const title = document.getElementById('ishan-player-title');
          const iframe = document.getElementById('ishan-player-iframe');
          const serverSelect = document.getElementById('ishan-server-select');
          const theatreLink = document.getElementById('ishan-link-theatre');

          title.textContent = movie.title;
          const server = serverSelect.value || 'tgvid';
          iframe.src = SERVERS[server](movie.id);

          theatreLink.href = `theatre.html?movie=${encodeURIComponent(movie.title)}&id=${movie.id}&type=movie`;
          modal.classList.add('is-open');
        }

        function closePlayer() {
          const modal = document.getElementById('ishan-player-modal');
          const iframe = document.getElementById('ishan-player-iframe');
          iframe.src = '';
          modal.classList.remove('is-open');
        }

        // --- Wire Events ---
        document.getElementById('ishan-player-close').onclick = closePlayer;
        document.getElementById('ishan-server-select').onchange = (e) => {
          if (currentMovie) {
            const iframe = document.getElementById('ishan-player-iframe');
            iframe.src = SERVERS[e.target.value](currentMovie.id);
          }
        };

        // Category pills click
        document.getElementById('ishan-cat-nav').addEventListener('click', (e) => {
          const btn = e.target.closest('.ishan-cat-btn');
          if (!btn) return;
          document.querySelectorAll('.ishan-cat-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentCategory = btn.getAttribute('data-cat');
          renderGrid();
        });

        // Search input
        document.getElementById('ishan-adult-search').addEventListener('input', () => {
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(renderGrid, 300);
        });

        // Escape key to close modal
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closePlayer();
        });

        function escapeHtml(str) {
          if (!str) return '';
          return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Initial load
        renderGrid();
      })();
    </script>
  </body>
</html>
