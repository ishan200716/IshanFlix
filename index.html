<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IshanFlix — Watch Movies, Series, K-Drama, Anime & Live TV</title>

      name="description"
      content="IshanFlix — a calm, fast streaming home for movies, series, K-Drama, anime and live TV with synchronized multiplayer rooms. No account needed."

    />

    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://api.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="ishanflix-multiplayer.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- PeerJS WebRTC P2P Library for Multiplayer Cross-Device Connection -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <!-- IshanFlix Real-time Multiplayer & Playback Sync Engine -->
    <script type="module" src="ishanflix-multiplayer.js"></script>

    <!-- Core IshanFlix Application (Reverse Engineered & Rebranded) -->
    <script type="module" src="ishanflix.js"></script>
  </body>
</html>
